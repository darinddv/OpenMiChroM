site_name: openMiChroM Tutorials
site_description: Conceptual and research-grade tutorials for openMiChroM
site_author: openMiChroM community

theme:
  name: material
  features:
    - navigation.expand
    - navigation.tabs
    - navigation.sections
    - content.code.annotate

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
